[project]
name = "hyped"
dynamic = ["version"]
description = "Easily streamline and customize data pipelines"
readme = "README.md"
classifiers = [
    "License :: Freely Distributable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
authors = [
    {name = "open-hyped"},
]
requires-python = ">=3.10"
license = {text = "Apache 2.0"}
dependencies = [
    "datasets>=3.2.0",
    "fsspec<=2023.9.2",
    "networkx>=3.4.2",
    "matplotlib>=3.8.2",
    "pydantic>=2.10.4",
    "nest-asyncio>=1.6.0",
    "jinja2>=3.1.5",
    "pyarrow==17.0.0"  # bug in pyarrow >18, remove this pin once the bug is fixed
]

[project.optional-dependencies]
linting = ["pre-commit"]
tests = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-integration",
]
docs = ["sphinx", "furo", "nbsphinx", "nbsphinx-link"]
serve = ["hyped-extensions-serve"]
nlp = ["hyped-extensions-nlp"]
parsers = ["hyped-extensions-parsers[cas]"]

[build-system]
requires = ["setuptools >= 61.0.0", "setuptools_scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
concurrency = ["multiprocessing","thread"]
parallel = true
sigterm = true
data_file = "/tmp/.coverage"

[tool.coverage.report]
ignore_errors = true
omit = ["tests/*", "src/hyped/__version__.py"]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",

    # Don't complain about overloaded functions
    "@(typing\\.)?overload",
    "pragma: not covered"
]

[tool.setuptools_scm]
version_file = "src/hyped/__version__.py"

[tool.black]
target-version = ["py310"]
line-length = 100
docstring-style = "google"

[tool.isort]
profile = "black"
line_length = 100
skip = ["docs/source/conf.py"]

[tool.ruff]
line-length = 100
ignore = ["E741", "B028", "B006", "B008", "B023"]
select = ["D", "E", "F", "W", "N", "B", "T"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
# Don't check docstrings of `tests` and `docs`
"tests/**" = ["D", "N"]
"docs/**" = ["D"]
